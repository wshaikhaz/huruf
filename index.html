<style>
  :root {
    color-scheme: light;
    --bg: #faf9f5;
    --surface: #ffffff;
    --border: #e4e2da;
    --ink: #1b1a17;
    --ink-soft: #85817c;
    --ink-faint: #b3afa5;

    --grp-a: #b81e1e; --grp-b: #18953d; --grp-c: #8f24db; --grp-d: #9e8d1a;

  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161513;
      --surface: #1d1c19;
      --border: #34322c;
      --ink: #f3f1ea;
      --ink-soft: #a39e90;
      --ink-faint: #6b6759;

      --grp-a: #e31414; --grp-b: #0c8f6f; --grp-c: #a136ed; --grp-d: #8a7b0c;
      --grp-e: #0e88a1; --grp-f: #d9137e; --grp-g: #2e930d; --grp-h: #6761f1;
      --grp-i: #c84f11; --grp-j: #0d915f; --grp-k: #bf12cf; --grp-l: #6d860c;
      --grp-m: #137ae0; --grp-n: #e0143e; --grp-o: #0d924f; --grp-p: #8b4df0;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161513;
    --surface: #1d1c19;
    --border: #34322c;
    --ink: #f3f1ea;
    --ink-soft: #a39e90;
    --ink-faint: #6b6759;

    --grp-a: #e31414; --grp-b: #0c8f6f; --grp-c: #a136ed; --grp-d: #8a7b0c;
    --grp-e: #0e88a1; --grp-f: #d9137e; --grp-g: #2e930d; --grp-h: #6761f1;
    --grp-i: #c84f11; --grp-j: #0d915f; --grp-k: #bf12cf; --grp-l: #6d860c;
    --grp-m: #137ae0; --grp-n: #e0143e; --grp-o: #0d924f; --grp-p: #8b4df0;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: max(16px, calc((100% - 900px) / 2));
    padding-block: 32px 56px;
  }

  .page { max-width: 900px; margin: 0 auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .tile {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .letter-btn {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border-radius: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  .letter-btn:hover { background: color-mix(in srgb, var(--tile-color) 8%, transparent); }
  .letter-btn:focus-visible {
    outline: 2px solid var(--tile-color);
    outline-offset: 2px;
  }

  .glyph {
    font-family: "Noto Naskh Arabic", serif;
    font-size: clamp(4rem, 12vw, 6.8rem);
    line-height: 1;
    color: var(--tile-color);
    transition: opacity 200ms ease;
  }

  .play-btn, .write-btn {
    all: unset;
    position: absolute;
    inset-block-end: 5px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--ink-faint);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .play-btn { inset-inline-end: 5px; }
  .write-btn { inset-inline-start: 5px; }
  .play-btn:hover, .play-btn:focus-visible,
  .write-btn:hover, .write-btn:focus-visible { color: var(--tile-color); background: color-mix(in srgb, var(--tile-color) 12%, transparent); }
  .play-btn:focus-visible, .write-btn:focus-visible { outline: 2px solid var(--tile-color); outline-offset: 1px; }
  .play-btn svg, .write-btn svg { width: 15px; height: 15px; }
  .write-btn[disabled] { opacity: 0.4; cursor: default; }

  .stroke-overlay {
    position: absolute;
    inset: 14%;
    pointer-events: none;
    opacity: 0;
  }
  .stroke-overlay path, .stroke-overlay circle { stroke: var(--tile-color); }
  .stroke-overlay path { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .stroke-overlay circle { fill: var(--tile-color); stroke: none; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--ink) 45%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay[hidden] { display: none !important; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px 28px;
    width: 100%;
    max-width: 480px;
    position: relative;
  }

  .modal-close {
    all: unset;
    position: absolute;
    inset-block-start: 10px;
    inset-inline-end: 12px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
  }
  .modal-close:hover, .modal-close:focus-visible { background: var(--bg); color: var(--ink); }

  .modal-lead {
    font-family: "Noto Naskh Arabic", serif;
    font-size: clamp(3rem, 14vw, 4.2rem);
    text-align: center;
    margin-block-end: 22px;
    color: var(--modal-color);
  }

  .modal-forms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    direction: rtl;
  }

  .form-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-block: 16px;
    background: var(--bg);
    border-radius: 12px;
  }

  .form-label {
    font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .form-glyph {
    font-family: "Noto Naskh Arabic", serif;
    font-size: clamp(2.1rem, 9vw, 2.8rem);
    color: var(--modal-color);
    line-height: 1;
  }

  @media (prefers-reduced-motion: no-preference) {
    .letter-btn, .play-btn, .modal-close { transition: background-color 120ms ease, color 120ms ease; }
  }
</style></head><body>

</div>

  var grid = document.getElementById("grid");
  var overlay = document.getElementById("modalOverlay");
  var modal = overlay.querySelector(".modal");
  var modalLead = document.getElementById("modalLead");
  var formBeginning = document.getElementById("formBeginning");
  var formMiddle = document.getElementById("formMiddle");
  var formEnd = document.getElementById("formEnd");
  var closeBtn = document.getElementById("modalClose");

  function playSpeakerIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M3 9.5v5h3.6l5 4.3V5.2l-5 4.3H3z" fill="currentColor"/>' +

      '<path d="M18.4 5.8a9 9 0 0 1 0 12.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      "</svg>";
  }

  function pencilIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M15 4.5 19.5 9 8 20.5 3.5 21.5 4.5 17 16 5.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<path d="M13.2 6.3 17.7 10.8" stroke="currentColor" stroke-width="1.5"/>' +
      "</svg>";
  }

  // Draws a set of strokes into an SVG overlay in sequence, mimicking a hand
  // writing the letter: each stroke animates on, with a short pause before
  // the next (a dot is placed with a quick pop rather than "drawn").
  function playStrokes(svg, strokes, onDone) {
    svg.innerHTML = "";
    svg.setAttribute("viewBox", "0 0 100 100");
    var i = 0;
    function next() {
      if (i >= strokes.length) {
        if (onDone) onDone();
        return;
      }
      var s = strokes[i++];
      if (s.dot) {
        var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", s.dot.cx);
        c.setAttribute("cy", s.dot.cy);
        c.setAttribute("r", 0);
        svg.appendChild(c);
        c.animate([{ r: 0 }, { r: s.dot.r * 1.3 }, { r: s.dot.r }], { duration: 220, easing: "ease-out" })
          .finished.then(function () { c.setAttribute("r", s.dot.r); setTimeout(next, 160); });
      } else {
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", s.d);
        svg.appendChild(p);
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        var duration = Math.max(450, len * 9);
        p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: duration, easing: "ease-in-out", fill: "forwards" })
          .finished.then(function () { setTimeout(next, 200); });
      }
    }
    next();
  }

  function triggerWrite(tile, item) {
    if (tile.dataset.writing === "1") return;
    var glyph = tile.querySelector(".glyph");
    var overlay = tile.querySelector(".stroke-overlay");
    tile.dataset.writing = "1";
    glyph.style.opacity = "0";
    overlay.style.opacity = "1";
    playStrokes(overlay, STROKES[item.ch], function () {
      setTimeout(function () {
        overlay.style.opacity = "0";
        glyph.style.opacity = "1";
        tile.dataset.writing = "0";
      }, 500);
    });
  }

  LETTERS.forEach(function (item) {
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.style.setProperty("--tile-color", "var(--grp-" + item.grp + ")");

    var letterBtn = document.createElement("button");
    letterBtn.className = "letter-btn";
    letterBtn.setAttribute("aria-label", "Show the written forms of " + item.ch);
    letterBtn.innerHTML = '<span class="glyph" lang="ar">' + item.ch + "</span>";
    letterBtn.addEventListener("click", function () {
      openModal(item, letterBtn);
    });

    var playBtn = document.createElement("button");
    playBtn.className = "play-btn";
    playBtn.setAttribute("aria-label", "Play the sound of " + item.ch);
    playBtn.innerHTML = playSpeakerIcon();
    playBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      speak(item.ch);
    });

    tile.appendChild(letterBtn);
    tile.appendChild(playBtn);

    if (STROKES[item.ch]) {
      var overlaySvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      overlaySvg.setAttribute("class", "stroke-overlay");
      tile.appendChild(overlaySvg);

      var writeBtn = document.createElement("button");
      writeBtn.className = "write-btn";
      writeBtn.setAttribute("aria-label", "Watch " + item.ch + " being written (pilot)");
      writeBtn.innerHTML = pencilIcon();
      writeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        triggerWrite(tile, item);
      });
      tile.appendChild(writeBtn);
    }

    grid.appendChild(tile);
  });

  function openModal(item, trigger) {
    lastFocused = trigger;
    modal.style.setProperty("--modal-color", "var(--grp-" + item.grp + ")");
    modalLead.textContent = item.ch;
    formBeginning.textContent = item.ch + ZWJ;
    formMiddle.textContent = ZWJ + item.ch + ZWJ;
    formEnd.textContent = ZWJ + item.ch;
    overlay.hidden = false;
    closeBtn.focus();
  }

  function closeModal() {
    overlay.hidden = true;
    if (lastFocused) lastFocused.focus();
  }

  closeBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !overlay.hidden) closeModal();
  });

  var cachedVoices = [];
  function refreshVoices() {
    if ("speechSynthesis" in window) cachedVoices = window.speechSynthesis.getVoices();
  }
  if ("speechSynthesis" in window) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  function speak(letter) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(letter);
    utter.lang = "ar-SA";
    utter.rate = 0.7;
    var arVoice = cachedVoices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf("ar") === 0; });
    if (arVoice) utter.voice = arVoice;
    window.speechSynthesis.speak(utter);
  }
